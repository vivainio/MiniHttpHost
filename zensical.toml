[project]
site_name = "The MiniHttpHost book"
site_description = "Embed a small streaming HTTP server in an existing .NET Framework application."
site_author = "Ville Vainio"
site_url = "https://vivainio.github.io/MiniHttpHost/"
docs_dir = "docs"
repo_url = "https://github.com/vivainio/MiniHttpHost"
repo_name = "vivainio/MiniHttpHost"
edit_uri = "edit/main/docs/"

nav = [
  { "Introduction" = "index.md" },
  { "Build and embed" = "getting-started.md" },
  { "Using the server" = [
    { "Request context and streaming" = "streaming.md" },
    { "Routing and groups" = "routing.md" },
    { "Middleware, errors, and limits" = "middleware.md" },
    { "Lifetime and concurrency" = "lifetime.md" },
    { "Response compression" = "compression.md" },
    { "Multipart and advanced HTTP" = "advanced-http.md" },
    { "Framework web types" = "framework-web-types.md" },
  ] },
  { "Architecture" = [
    { "WCF coexistence" = "wcf-coexistence.md" },
    { "SOAP compatibility endpoint" = "soap-compatibility.md" },
    { "Framework and performance comparison" = "framework-comparison.md" },
  ] },
  { "Development" = [
    { "Examples and checks" = "development.md" },
    { "Building this book" = "documentation.md" },
    { "NuGet and trusted publishing" = "nuget.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/network"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
