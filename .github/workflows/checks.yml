name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      MINIHTTPHOST_TEST_PORT: 18081
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Reserve local test URLs
        shell: pwsh
        run: |
          foreach ($port in 18081..18088) {
            netsh http add urlacl url=http://localhost:$port/ sddl='D:(A;;GX;;;WD)'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: dotnet build examples/ConsoleHost/ConsoleHost.csproj -c Release
      - run: dotnet build tests/Checks/Checks.csproj -c Release
      - name: Run checks on .NET Framework and HTTP.sys
        shell: pwsh
        run: '& ./tests/Checks/bin/Release/net472/Checks.exe'
      - name: Run checks on modern .NET
        run: dotnet tests/Checks/bin/Release/net10.0/Checks.dll
      - name: Pack both target frameworks
        run: dotnet pack MiniHttpHost.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-preview
          path: artifacts/*.nupkg

  modern:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Checks/Checks.csproj -c Release -f net10.0
