name: Windows checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      MINIHTTPHOST_TEST_PORT: 18081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reserve local test URLs
        shell: pwsh
        run: |
          netsh http add urlacl url=http://localhost:18081/ sddl='D:(A;;GX;;;WD)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          netsh http add urlacl url=http://localhost:18082/ sddl='D:(A;;GX;;;WD)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          netsh http add urlacl url=http://localhost:18083/ sddl='D:(A;;GX;;;WD)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          netsh http add urlacl url=http://localhost:18084/ sddl='D:(A;;GX;;;WD)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet build examples/ConsoleHost/ConsoleHost.csproj -c Release
      - run: dotnet build tests/Checks/Checks.csproj -c Release
      - name: Run checks on .NET Framework and HTTP.sys
        shell: pwsh
        run: '& ./tests/Checks/bin/Release/net472/Checks.exe'
